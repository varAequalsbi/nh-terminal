name: Quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PostgreSQL, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: nh_terminal_test
          POSTGRES_USER: nh_terminal
          POSTGRES_PASSWORD: nh_terminal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nh_terminal -d nh_terminal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://nh_terminal:nh_terminal_ci@127.0.0.1:5432/nh_terminal_test
      DATABASE_SSL: disable
      DATABASE_POOL_MAX: 3
      DATABASE_CONNECT_TIMEOUT_SECONDS: 5
      SESSION_COOKIE_SECURE: false
      API_ALLOWED_ORIGIN: http://127.0.0.1:5190

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check TypeScript
        run: npm run check:types

      - name: Check lint and formatting
        run: npm run lint && npm run format:check

      - name: Audit production dependencies
        run: npm run audit:prod
        timeout-minutes: 3

      - name: Run PostgreSQL integration tests
        run: npm test

      - name: Run critical browser journeys
        run: npm run test:e2e

      - name: Build production bundle
        run: npm run build

      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
